<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

    <!--
      Fonts are served from this origin — see src/fonts.css.

      There is deliberately no preconnect to fonts.googleapis.com or
      fonts.gstatic.com any more: nothing is fetched from them, and a
      preconnect to a host you never use is a wasted DNS lookup and TLS
      handshake.

      These two weights are preloaded because they are what renders above the
      fold on every page — Poppins 400 for body copy and Poppins 700 for the
      heading. Starting them during HTML parse, rather than after the
      stylesheet has been fetched and parsed, is the whole point. The other
      weights and the latin-ext subsets are left to load on demand; preloading
      all ten would compete with the two that matter.

      Both were Inter 400 and Syne 700 until Poppins replaced both families.
      Two preloads either way — but now they are two weights of one face, so a
      heading and a paragraph no longer wait on separate downloads.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/poppins-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/poppins-700-latin.woff2"
      crossorigin
    />

    <title>Heraja — Digital Agricultural Infrastructure</title>
    <meta name="description" content="Heraja builds the digital backbone that connects production, coordination, and market access — enabling agricultural organizations to operate with transparency, efficiency, and scale." />
    <link rel="canonical" href="https://www.heraja.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heraja" />
    <meta property="og:title" content="Heraja — Digital Agricultural Infrastructure" />
    <meta property="og:description" content="Heraja builds the digital backbone that connects production, coordination, and market access — enabling agricultural organizations to operate with transparency, efficiency, and scale." />
    <meta property="og:url" content="https://www.heraja.com/" />
    <meta property="og:image" content="https://www.heraja.com/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heraja — Digital Agricultural Infrastructure" />
    <meta name="twitter:description" content="Heraja builds the digital backbone that connects production, coordination, and market access — enabling agricultural organizations to operate with transparency, efficiency, and scale." />
    <meta name="twitter:image" content="https://www.heraja.com/assets/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
